name: build-apk

# 推到 GitHub 后：Actions → build-apk → 运行 → 下载 APK
on:
  push:
    paths:
      - "*.py"
      - "assets/**"
      - "runtime/**"
      - "web_extra/**"
      - "build_web.sh"
      - "sync_android_assets.sh"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"

      - name: Rebuild web bundle for Android
        run: |
          chmod +x build_web.sh sync_android_assets.sh
          ./build_web.sh
          ./sync_android_assets.sh

      - name: Build release APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 解密四界征战-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
